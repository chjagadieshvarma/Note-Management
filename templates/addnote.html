{% extends "base.html" %}

{% block title %}Add Note{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="text-center mb-4">➕ Add New Note</h2>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Note Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="Enter note title"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Note Content
                        </label>

                        <textarea
                            name="content"
                            class="form-control"
                            rows="8"
                            placeholder="Write your note here..."
                            required
                        ></textarea>

                    </div>


                    <div class="d-grid">

                        <button type="submit" class="btn btn-primary">
                            💾 Save Note
                        </button>

                    </div>

                </form>


                <div class="text-center mt-3">

                    <a href="/dashboard" class="btn btn-outline-secondary">
                        ← Back to Dashboard
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
