{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="text-center">

    <h1 class="mb-3">Welcome, {{ session['username'] }}! 👋</h1>

    <p class="text-muted">
        You are successfully logged in.
    </p>

</div>

<div class="row justify-content-center mt-5">

    <div class="col-md-4">

        <div class="card shadow-sm">

            <div class="card-body text-center">

                <h4 class="card-title mb-4">My Notes</h4>

                <a href="/add_note" class="btn btn-primary w-100 mb-3">
                    ➕ Add Note
                </a>

                <a href="/viewallnote" class="btn btn-success w-100">
                    📒 View My Notes
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
